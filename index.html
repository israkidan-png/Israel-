<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager - Pacta LLP</title>
    
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <style>
        /* Custom admin login page styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* Optional: Customize the CMS logo/preview */
    </style>
</head>
<body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
    
    <!-- Custom preview template (optional) -->
    <script>
        // Register custom preview styles or components if needed
        CMS.registerPreviewStyle('/css/style.css');
        
        // Optional: Customize the CMS dashboard
        CMS.init({
            config: {
                backend: {
                    name: 'git-gateway',
                },
                load_config_file: true, // Load config.yml
            }
        });
    </script>
</body>
</html>
