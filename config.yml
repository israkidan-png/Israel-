backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://pactallp.netlify.app
display_url: https://pactallp.netlify.app

collections:
  - name: "insights"
    label: "Legal Insights & Updates"
    label_singular: "Legal Insight"
    folder: "insights"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
      - label: "Featured Image"
        name: "thumbnail"
        widget: "image"
        required: false
      - label: "Summary"
        name: "summary"
        widget: "text"
      - label: "Body"
        name: "body"
        widget: "markdown"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Corporate Law"
          - "Capital Markets"
          - "Investment"
          - "Tax"
          - "Compliance"
          - "Litigation"
          - "General"
        default: "General"